name: Publish to npm

# Fires automatically when a GitHub release is published. To cut a new
# version: bump the version in package.json + CHANGELOG.md, merge, then
# create a release at github.com/<org>/<repo>/releases/new — this workflow
# does the rest.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json version matches the release tag
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          REL_TAG="${{ github.event.release.tag_name }}"
          if [ "$PKG_VERSION" != "$REL_TAG" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($REL_TAG). Bump the version before cutting a release."
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
